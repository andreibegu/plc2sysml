[package]
name = "plc2sysml"
version = "0.1.0"
edition = "2024"
description = "Derive SysML v2 models from mixed-language PLC projects"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
heck = "0.5"
indicatif = "0.18"
petgraph = { version = "0.8", default-features = false, features = ["std", "graphmap"] }
pretty = "0.12"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
